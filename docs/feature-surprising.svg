<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="560" rx="20" fill="#191920"/>
  <rect x="0.5" y="0.5" width="1199" height="559" rx="19.5" fill="none" stroke="#2e2e38" stroke-width="1"/>

  <text x="56" y="62" fill="#ededf2" font-size="30" font-weight="600" letter-spacing="-0.4">Surprising connections</text>
  <g transform="translate(420,40)">
    <rect x="0" y="0" width="86" height="30" rx="15" fill="#2e2410" stroke="#6b5420" stroke-width="1"/>
    <circle cx="20" cy="15" r="4" fill="#e0b45a"/>
    <text x="34" y="20" fill="#e6c074" font-size="14" font-weight="500">New</text>
  </g>
  <text x="56" y="100" fill="#a7a7b4" font-size="18">A discovery list that cannot fill up with things you already knew.</text>

  <!-- ============ left: why other lists go stale ============ -->
  <g transform="translate(56,140)">
    <rect x="0" y="0" width="520" height="240" rx="14" fill="#15151b" stroke="#2a2a34" stroke-width="1"/>
    <text x="24" y="34" fill="#c8cbd6" font-size="15" font-weight="600">The problem with ranking by similarity</text>

    <text x="24" y="66" fill="#a7a7b4" font-size="13.5">The most similar notes are also the most obvious ones.</text>

    <g transform="translate(24,86)">
      <rect x="0" y="0" width="456" height="34" rx="8" fill="#1e1e27" stroke="#3a3a48"/>
      <text x="14" y="22" fill="#8a8f9e" font-size="12.5">NP-Completeness and NP-hardness</text>
      <text x="440" y="22" fill="#9a7f8b" font-size="12.5" text-anchor="end">obvious</text>
    </g>
    <g transform="translate(24,128)">
      <rect x="0" y="0" width="456" height="34" rx="8" fill="#1e1e27" stroke="#3a3a48"/>
      <text x="14" y="22" fill="#8a8f9e" font-size="12.5">Komplexe Zahlen and Quaternionen</text>
      <text x="440" y="22" fill="#9a7f8b" font-size="12.5" text-anchor="end">obvious</text>
    </g>

    <text x="24" y="196" fill="#a7a7b4" font-size="13">Blind reviewers called 8 of 9 such finds predictable</text>
    <text x="24" y="216" fill="#a7a7b4" font-size="13">from the two titles alone. Useful for tidying. Not a discovery.</text>
  </g>

  <!-- ============ right: the gate ============ -->
  <g transform="translate(616,140)">
    <rect x="0" y="0" width="528" height="240" rx="14" fill="#15151b" stroke="#2a2a34" stroke-width="1"/>
    <text x="24" y="34" fill="#c8cbd6" font-size="15" font-weight="600">So obviousness is the filter, not an afterthought</text>

    <g transform="translate(24,58)">
      <circle cx="9" cy="9" r="5" fill="#4fc98a"/>
      <text x="26" y="14" fill="#a7a7b4" font-size="13.5">Your links connect them through shared context</text>
    </g>
    <g transform="translate(24,90)">
      <circle cx="9" cy="9" r="5" fill="#4fc98a"/>
      <text x="26" y="14" fill="#a7a7b4" font-size="13.5">Each note sits OUTSIDE the other's top matches</text>
    </g>
    <g transform="translate(24,122)">
      <circle cx="9" cy="9" r="5" fill="#4fc98a"/>
      <text x="26" y="14" fill="#a7a7b4" font-size="13.5">The bridging note is not a hub everything links to</text>
    </g>

    <line x1="24" y1="158" x2="504" y2="158" stroke="#2a2a34"/>
    <text x="24" y="188" fill="#8ee8ba" font-size="13.5" font-weight="600">A pair that passes all three cannot be a sibling.</text>
    <text x="24" y="212" fill="#8a8f9e" font-size="12.5">The gate is structural, so the list stays surprising as your vault grows.</text>
  </g>

  <!-- ============ bottom: real finds ============ -->
  <g transform="translate(56,406)">
    <rect x="0" y="0" width="1088" height="118" rx="14" fill="#15151b" stroke="#2a2a34" stroke-width="1"/>
    <text x="24" y="32" fill="#c8cbd6" font-size="15" font-weight="600">Found this way on the test vault</text>

    <g transform="translate(24,48)">
      <rect x="0" y="0" width="336" height="52" rx="9" fill="#1e1e27" stroke="#3a3a48"/>
      <text x="14" y="22" fill="#ededf2" font-size="13">Entropy and Hash Table</text>
      <text x="14" y="40" fill="#8ee8ba" font-size="11.5">via Hash Function</text>
    </g>
    <g transform="translate(376,48)">
      <rect x="0" y="0" width="336" height="52" rx="9" fill="#1e1e27" stroke="#3a3a48"/>
      <text x="14" y="22" fill="#ededf2" font-size="13">Gradient and Mehrfachintegral</text>
      <text x="14" y="40" fill="#8ee8ba" font-size="11.5">via Divergenz und Rotation</text>
    </g>
    <g transform="translate(728,48)">
      <rect x="0" y="0" width="336" height="52" rx="9" fill="#1e1e27" stroke="#3a3a48"/>
      <text x="14" y="22" fill="#ededf2" font-size="13">Master Theorem and Union-Find</text>
      <text x="14" y="40" fill="#8ee8ba" font-size="11.5">via Amortized Analysis</text>
    </g>
  </g>
</svg>
