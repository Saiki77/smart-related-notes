<svg viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="620" rx="20" fill="#191920"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="19.5" fill="none" stroke="#2e2e38" stroke-width="1"/>

  <text x="56" y="62" fill="#ededf2" font-size="30" font-weight="600" letter-spacing="-0.4">Now it reads your links, not just your words</text>
  <g transform="translate(700,40)">
    <rect x="0" y="0" width="86" height="30" rx="15" fill="#122a1c" stroke="#255c3a" stroke-width="1"/>
    <circle cx="20" cy="15" r="4" fill="#4fc98a"/>
    <text x="34" y="20" fill="#7fdcaa" font-size="14" font-weight="500">New</text>
  </g>
  <text x="56" y="100" fill="#a7a7b4" font-size="18">About 30% of the links you actually make point at a note the wording alone would never surface.</text>

  <!-- ============ left: the problem/solution picture ============ -->
  <g transform="translate(56,140)">
    <rect x="0" y="0" width="520" height="290" rx="14" fill="#15151b" stroke="#2a2a34" stroke-width="1"/>
    <text x="24" y="34" fill="#c8cbd6" font-size="15" font-weight="600">Two notes that never mention each other</text>

    <!-- note A -->
    <g transform="translate(28,62)">
      <rect x="0" y="0" width="150" height="54" rx="9" fill="#1e1e27" stroke="#3a3a48"/>
      <text x="14" y="23" fill="#ededf2" font-size="13.5" font-weight="600">Entropy</text>
      <text x="14" y="41" fill="#8a8f9e" font-size="11.5">information theory</text>
    </g>
    <!-- bridge note -->
    <g transform="translate(185,138)">
      <rect x="0" y="0" width="150" height="54" rx="9" fill="#1c2620" stroke="#3f6b52"/>
      <text x="14" y="23" fill="#8ee8ba" font-size="13.5" font-weight="600">Hash Function</text>
      <text x="14" y="41" fill="#6f9e85" font-size="11.5">you linked both</text>
    </g>
    <!-- note B -->
    <g transform="translate(342,62)">
      <rect x="0" y="0" width="150" height="54" rx="9" fill="#1e1e27" stroke="#3a3a48"/>
      <text x="14" y="23" fill="#ededf2" font-size="13.5" font-weight="600">Hash Table</text>
      <text x="14" y="41" fill="#8a8f9e" font-size="11.5">data structures</text>
    </g>

    <!-- link lines through the bridge -->
    <path d="M103 116 L260 138" stroke="#4fc98a" stroke-width="1.6" fill="none" opacity="0.85"/>
    <path d="M417 116 L260 138" stroke="#4fc98a" stroke-width="1.6" fill="none" opacity="0.85"/>
    <!-- the absent direct similarity -->
    <path d="M178 89 L342 89" stroke="#6b5460" stroke-width="1.6" stroke-dasharray="5 5" fill="none"/>
    <text x="260" y="82" fill="#9a7f8b" font-size="11.5" text-anchor="middle">wording: unrelated</text>

    <text x="28" y="232" fill="#a7a7b4" font-size="13">The prose has nothing in common, so similarity ranking</text>
    <text x="28" y="252" fill="#a7a7b4" font-size="13">cannot pair them. The shared context you already</text>
    <text x="28" y="272" fill="#a7a7b4" font-size="13">created says otherwise, and now that counts as evidence.</text>
  </g>

  <!-- ============ right: measured lift ============ -->
  <g transform="translate(616,140)">
    <rect x="0" y="0" width="528" height="290" rx="14" fill="#15151b" stroke="#2a2a34" stroke-width="1"/>
    <text x="24" y="34" fill="#c8cbd6" font-size="15" font-weight="600">Measured on a 494-note vault, 20% of links held out</text>

    <!-- bars: x from 24, width scale 380 for 0..0.8 -->
    <g font-size="12.5">
      <text x="24" y="76" fill="#8a8f9e">wording only</text>
      <rect x="150" y="63" width="316" height="18" rx="4" fill="#23232d"/>
      <rect x="150" y="63" width="263" height="18" rx="4" fill="#5a6070"/>
      <text x="424" y="77" fill="#c8cbd6" font-weight="600">0.66</text>

      <text x="24" y="120" fill="#8ee8ba" font-weight="600">+ your link graph</text>
      <rect x="150" y="107" width="316" height="18" rx="4" fill="#23232d"/>
      <rect x="150" y="107" width="295" height="18" rx="4" fill="#4fc98a"/>
      <text x="456" y="121" fill="#8ee8ba" font-weight="600">0.75</text>
    </g>
    <text x="24" y="152" fill="#6b7080" font-size="11.5">Share of your real links found in the top 10, jina-v5-nano.</text>

    <line x1="24" y1="176" x2="504" y2="176" stroke="#2a2a34"/>

    <text x="24" y="206" fill="#c8cbd6" font-size="14" font-weight="600">The connections similarity cannot see</text>
    <g transform="translate(24,222)">
      <rect x="0" y="0" width="456" height="14" rx="7" fill="#23232d"/>
      <rect x="0" y="0" width="274" height="14" rx="7" fill="#e0b45a"/>
      <text x="286" y="12" fill="#e6c074" font-size="12.5" font-weight="600">60% recovered</text>
    </g>
    <text x="24" y="262" fill="#8a8f9e" font-size="12.5">Links whose target sits outside the note's top 10 by wording.</text>
    <text x="24" y="280" fill="#8a8f9e" font-size="12.5">Ranking by similarity alone recovers none of them, by definition.</text>
  </g>

  <!-- ============ bottom: the card ============ -->
  <g transform="translate(56,462)">
    <rect x="0" y="0" width="1088" height="112" rx="14" fill="#15151b" stroke="#2a2a34" stroke-width="1"/>
    <text x="24" y="32" fill="#c8cbd6" font-size="15" font-weight="600">And the card tells you why it is there</text>
    <g transform="translate(24,48)">
      <rect x="0" y="0" width="330" height="48" rx="9" fill="#1e1e27" stroke="#3a3a48"/>
      <text x="16" y="21" fill="#ededf2" font-size="13.5" font-weight="600">Hash Table</text>
      <text x="16" y="38" fill="#8a8f9e" font-size="11.5">Concepts</text>
      <g transform="translate(192,13)">
        <rect x="0" y="0" width="122" height="23" rx="11.5" fill="#1c2620" stroke="#3f6b52"/>
        <text x="61" y="16" fill="#8ee8ba" font-size="11.5" text-anchor="middle">via Hash Function</text>
      </g>
    </g>
    <text x="380" y="72" fill="#a7a7b4" font-size="13.5">No unexplained low score: the note that bridges the two is named on the card.</text>
    <text x="380" y="92" fill="#6b7080" font-size="12.5">Turn it down or off any time with Link-graph influence.</text>
  </g>
</svg>
