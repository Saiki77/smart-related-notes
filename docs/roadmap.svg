<svg viewBox="0 0 1200 1520" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect width="1200" height="1520" rx="20" fill="#191920"/>
  <rect x="0.5" y="0.5" width="1199" height="1519" rx="19.5" fill="none" stroke="#2e2e38" stroke-width="1"/>

  <text x="56" y="66" fill="#ededf2" font-size="32" font-weight="600" letter-spacing="-0.4">Roadmap</text>
  <text x="56" y="104" fill="#a7a7b4" font-size="18">Where the plugin is going. Nothing ships until it is measured on a real vault, and some of this will not survive that.</text>

  <!-- spine -->
  <line x1="90" y1="168" x2="90" y2="1400" stroke="#2e2e38" stroke-width="2"/>

  <!-- ============================== v3: shipped ============================== -->
  <circle cx="90" cy="200" r="9" fill="#4fc98a"/>
  <circle cx="90" cy="200" r="15" fill="none" stroke="#255c3a" stroke-width="2"/>
  <text x="128" y="194" fill="#ededf2" font-size="22" font-weight="600">3.0</text>
  <g transform="translate(180,178)">
    <rect x="0" y="0" width="84" height="26" rx="13" fill="#122a1c" stroke="#255c3a"/>
    <text x="42" y="18" fill="#7fdcaa" font-size="12.5" font-weight="600" text-anchor="middle">Shipped</text>
  </g>
  <text x="128" y="222" fill="#8a8f9e" font-size="14">Ranking stops being about wording alone.</text>

  <g transform="translate(128,246)">
    <rect x="0" y="0" width="1016" height="286" rx="14" fill="#141a16" stroke="#2a3a30" stroke-width="1"/>

    <g transform="translate(28,28)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Link-graph ranking</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Reads the shape of your links, not just your words.</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">A card can now say "via the note that bridges them".</text>
      <text x="0" y="70" fill="#7fdcaa" font-size="12.5">Held-out link recall 0.66 to 0.75</text>
    </g>
    <g transform="translate(536,28)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Surprising connections</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Pairs your links connect but your wording never would.</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">Obviousness is the filter, so the list cannot go stale.</text>
      <text x="0" y="70" fill="#7fdcaa" font-size="12.5">Recovers 60% of what similarity cannot see</text>
    </g>
    <line x1="28" y1="140" x2="988" y2="140" stroke="#22301f"/>
    <g transform="translate(28,172)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">A map of your vault</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Every note a point, every cluster named automatically.</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">Click a point to open it, click a cluster to hide it.</text>
      <text x="0" y="70" fill="#7fdcaa" font-size="12.5">Cluster purity 0.65 against a 0.29 baseline</text>
    </g>
    <g transform="translate(536,172)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Template de-crowding</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Daily notes used to match only other daily notes.</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">The shared skeleton is subtracted, the content is not.</text>
      <text x="0" y="70" fill="#7fdcaa" font-size="12.5">Crowding 9.9 out of 10 down to 0.7</text>
    </g>
  </g>

  <!-- ============================== v4: next ============================== -->
  <circle cx="90" cy="596" r="9" fill="#e0b45a"/>
  <circle cx="90" cy="596" r="15" fill="none" stroke="#6b5420" stroke-width="2"/>
  <text x="128" y="590" fill="#ededf2" font-size="22" font-weight="600">4.0</text>
  <g transform="translate(180,574)">
    <rect x="0" y="0" width="64" height="26" rx="13" fill="#2e2410" stroke="#6b5420"/>
    <text x="32" y="18" fill="#e6c074" font-size="12.5" font-weight="600" text-anchor="middle">Next</text>
  </g>
  <text x="128" y="618" fill="#8a8f9e" font-size="14">Asking the vault questions, and letting other tools use what it knows.</text>

  <g transform="translate(128,642)">
    <rect x="0" y="0" width="1016" height="330" rx="14" fill="#15151b" stroke="#2a2a34" stroke-width="1"/>

    <g transform="translate(28,28)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Search by category</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Ask for "characters" and get the characters, not the</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">note about characters. No tags or index note needed.</text>
      <text x="0" y="70" fill="#e6c074" font-size="12.5">Measured at 0.78, but only on a model that</text>
      <text x="0" y="88" fill="#e6c074" font-size="12.5">handles short queries. It will say so.</text>
    </g>
    <g transform="translate(536,28)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Semantic views in Bases</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Meaning as a column you can sort, filter and group on,</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">so a table of notes can be built from what they say.</text>
      <text x="0" y="70" fill="#6b7080" font-size="12.5">Needs a spike against the current Bases API.</text>
    </g>
    <line x1="28" y1="160" x2="988" y2="160" stroke="#24242e"/>
    <g transform="translate(28,192)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Link suggestions with receipts</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Not just "these look similar" but the exact detail two</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">notes share, so you can judge it in a glance.</text>
      <text x="0" y="70" fill="#e6c074" font-size="12.5">Judged precision 0.40 to 0.60 in the lab</text>
    </g>
    <g transform="translate(536,192)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">A ranker built from channels</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Each signal scores independently and the weights are</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">fitted to your own links, per vault, on your machine.</text>
      <text x="0" y="70" fill="#e6c074" font-size="12.5">A channel only earns a place if it is measurably</text>
      <text x="0" y="88" fill="#e6c074" font-size="12.5">independent of the ones already there.</text>
    </g>
  </g>

  <!-- ============================== v5: exploring ============================== -->
  <circle cx="90" cy="1036" r="9" fill="#7a8ad0"/>
  <circle cx="90" cy="1036" r="15" fill="none" stroke="#3a4270" stroke-width="2"/>
  <text x="128" y="1030" fill="#ededf2" font-size="22" font-weight="600">5.0</text>
  <g transform="translate(180,1014)">
    <rect x="0" y="0" width="98" height="26" rx="13" fill="#171a2c" stroke="#3a4270"/>
    <text x="49" y="18" fill="#a3b0e8" font-size="12.5" font-weight="600" text-anchor="middle">Exploring</text>
  </g>
  <text x="128" y="1058" fill="#8a8f9e" font-size="14">Bigger bets. These are hypotheses with open questions, not promises.</text>

  <g transform="translate(128,1082)">
    <rect x="0" y="0" width="1016" height="286" rx="14" fill="#15151b" stroke="#2a2a34" stroke-width="1" stroke-dasharray="3 6"/>

    <g transform="translate(28,28)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Help while you write</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Surface the older passage that belongs in the paragraph</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">you are typing, before you remember it yourself.</text>
      <text x="0" y="70" fill="#8a93c8" font-size="12.5">Useful 7 times in 10, but rarely surprising.</text>
      <text x="0" y="88" fill="#8a93c8" font-size="12.5">Ships as writing help, not discovery.</text>
    </g>
    <g transform="translate(536,28)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Notes that disagree</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Two notes asserting opposite things about the same</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">subject, which is worth knowing and easy to verify.</text>
      <text x="0" y="70" fill="#8a93c8" font-size="12.5">Unmeasured. Needs a study of how often this</text>
      <text x="0" y="88" fill="#8a93c8" font-size="12.5">even happens in a real vault first.</text>
    </g>
    <line x1="28" y1="150" x2="988" y2="150" stroke="#24242e"/>
    <g transform="translate(28,182)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">The signal only your machine has</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Which notes you open and edit together in one sitting</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">is evidence no text or link can give, and it never leaves.</text>
      <text x="0" y="70" fill="#8a93c8" font-size="12.5">The last plausibly independent channel left, and</text>
      <text x="0" y="88" fill="#8a93c8" font-size="12.5">the one a cloud service structurally cannot have.</text>
    </g>
    <g transform="translate(536,182)">
      <text x="0" y="0" fill="#ededf2" font-size="15.5" font-weight="600">Vaults of a hundred thousand notes</text>
      <text x="0" y="24" fill="#8a8f9e" font-size="13.5">Today every ranking scans the whole vault. A proper</text>
      <text x="0" y="44" fill="#8a8f9e" font-size="13.5">nearest-neighbour index turns that into a lookup.</text>
      <text x="0" y="70" fill="#8a93c8" font-size="12.5">Unglamorous, and the thing that decides whether</text>
      <text x="0" y="88" fill="#8a93c8" font-size="12.5">any of the above survives a real archive.</text>
    </g>
  </g>

  <text x="128" y="1430" fill="#6b7080" font-size="13">Everything above runs on your machine. No cloud, no account, no text sent anywhere, in any version.</text>
  <text x="128" y="1456" fill="#6b7080" font-size="13">Ideas that fail their measurement get cut, not shipped quietly. Bridges, analogy search, a duplicate alarm, a</text>
  <text x="128" y="1478" fill="#6b7080" font-size="13">personal similarity metric and a keyword channel were each built, measured, and dropped.</text>
</svg>
