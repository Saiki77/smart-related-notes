name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Lint (Obsidian plugin guidelines)
        run: npm run lint

      - name: Build plugin
        run: npm run build

      - name: Verify manifest version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          TAG_VERSION="${TAG#v}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Verify the ort wasm pairs the plugin will download exist for this build
        run: |
          # The plugin downloads (or dev-copies) a glue+wasm pair per device: the
          # CPU-only pair for the WASM path, the asyncify pair for a WebGPU pin.
          # Each MUST be the exact build transformers bundled, or WASM init fails,
          # and the CPU pair is the ONLY one with a GatherBlockQuantized kernel —
          # without it jina-v5-nano cannot load at all. gen-ort.mjs materialises
          # both from node_modules and pins their names+sizes into ORT_RUNTIMES;
          # fail the release if any expected file is missing (naming/layout drift
          # upstream). Releases ship ONLY main.js/manifest.json/styles.css (all
          # Obsidian downloads); the runtime is fetched once at first use and
          # cached in the plugin folder.
          node scripts/verify-ort-assets.mjs
          # Version read from the generated pin file (onnxruntime-web blocks
          # require('onnxruntime-web/package.json') via its "exports" map).
          ORT_VERSION=$(node -e "console.log((require('fs').readFileSync('src/ort-version.ts','utf8').match(/ORT_WEB_VERSION = \"([^\"]+)\"/)||[])[1]||'unknown')")
          echo "Runtime pinned to onnxruntime-web@${ORT_VERSION}."

      - name: Extract release notes from annotated tag
        run: |
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME} of Related Notes." > release-notes.md
          fi

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            main.js
            manifest.json
            styles.css
